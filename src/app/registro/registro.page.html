<ion-header>
  <ion-toolbar>
    <ion-title>BigNote by EcheMessi - Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="registrar()" #registroForm="ngForm">
    
    <!-- Nombre Completo -->
    <ion-item>
      <ion-label position="floating">Nombre Completo</ion-label>
      <ion-input type="text" [(ngModel)]="nombreUsuario" name="nombre" required></ion-input>
    </ion-item>
    <div *ngIf="errorNombre" class="error-message">{{ errorNombre }}</div>

    <!-- Contraseña -->
    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" [(ngModel)]="password" name="password" required></ion-input>
    </ion-item>
    <div *ngIf="errorPassword" class="error-message">{{ errorPassword }}</div>
    
    <!-- Edad -->
    <ion-item>
      <ion-label position="floating">Edad</ion-label>
      <ion-input type="number" [(ngModel)]="edad" name="edad" required></ion-input>
    </ion-item>
    <div *ngIf="errorEdad" class="error-message">{{ errorEdad }}</div>

    <!-- Correo Electrónico -->
    <ion-item>
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input type="email" [(ngModel)]="correo" name="correo" required></ion-input>
    </ion-item>
    <div *ngIf="errorCorreo" class="error-message">{{ errorCorreo }}</div>

    <!-- Sexo -->
    <ion-item>
      <ion-label>Sexo</ion-label>
      <ion-select [(ngModel)]="sexo" name="sexo" required>
        <ion-select-option value="Masculino">Masculino</ion-select-option>
        <ion-select-option value="Femenino">Femenino</ion-select-option>
        <ion-select-option value="Prefiero no contestar">Prefiero no contestar</ion-select-option>
      </ion-select>
    </ion-item>
    <div *ngIf="errorSexo" class="error-message">{{ errorSexo }}</div>

    <!-- Botón de Registro -->
    <ion-button expand="full" type="submit" [disabled]="!registroForm.form.valid">Registrarse</ion-button>
    <ion-button expand="full" routerLink="/login">Cancelar</ion-button>
  </form>
</ion-content>
