<ion-header>
  <ion-toolbar>
    <ion-title>Tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="full" (click)="agregarTarea()">Añadir Tarea</ion-button>

  <!-- Mensajes de error para cada campo -->
  <div *ngIf="errorTitulo" class="error-message">{{ errorTitulo }}</div>
  <div *ngIf="errorContenido" class="error-message">{{ errorContenido }}</div>
  <div *ngIf="errorFecha" class="error-message">{{ errorFecha }}</div>
  <div *ngIf="errorPrioridad" class="error-message">{{ errorPrioridad }}</div>

  <ion-item *ngFor="let tarea of tareas">
    <ion-label>
      <h2>{{ tarea.titulo }}</h2>
      <p>{{ tarea.contenido }}</p>
      <p><strong>Fecha:</strong> {{ tarea.fecha | date: 'short' }}</p>
      <p><strong>Prioridad:</strong> {{ tarea.prioridad }}</p>
    </ion-label>
    <ion-button (click)="editarTarea(tarea)" fill="clear">Editar</ion-button>
    <ion-button (click)="eliminarTarea(tarea)" fill="clear">Eliminar</ion-button>
  </ion-item>

  <ion-button expand="full" routerLink="/bienvenida">Volver a Inicio</ion-button>
</ion-content>
